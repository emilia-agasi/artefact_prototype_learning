[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "artefact-prototype-learning"
version = "0.1.0"
description = "Unsupervised, prototype-based artefact detection in histopathology foundation-model patch embeddings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Emilia Agasi" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "h5py>=3.8",
    "tqdm>=4.64",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
slides = ["openslide-python>=1.3"]   # only for looking at patch images
dev = ["pytest>=7", "ruff>=0.4", "ipykernel"]

[project.scripts]
apl = "artefact_prototype_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120